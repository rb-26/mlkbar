<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mlkbar Login</title>
  <meta name="theme-color" content="#fb0589" />
  <meta name="description" content="Log in to mlkbar." />
  <link rel="manifest" href="/manifest.webmanifest?v=20261111b" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=4" />
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css?v=20261118c" />
</head>
<body data-page="login">
  <div class="app-shell auth-shell">
    <header class="hero">
      <div class="brand-lockup">
        <img class="brand-logo" src="/branding/mlkbr-logo.png?v=4" alt="mlkbar" />
        <span class="brand-name">mlkbar</span>
      </div>
      <p id="auth-copy" class="hero-copy">Checking login…</p>
    </header>

    <main class="page auth-page">
      <section class="panel auth-panel">
        <div class="panel-heading">
          <h2 id="auth-title">mlkbar</h2>
        </div>

        <form id="login-form" class="entry-form" method="post" action="/api/auth/login" autocomplete="on">
          <label id="setup-code-field" class="field" hidden>
            <span>Setup Code</span>
            <input id="setup-code" name="setupCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-EFGH" />
          </label>

          <label class="field">
            <span>Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>

          <label id="confirm-password-field" class="field" hidden>
            <span>Confirm Password</span>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" />
          </label>

          <p id="auth-error" class="form-error" hidden></p>
          <p id="auth-feedback" class="form-feedback" hidden></p>

          <div class="form-actions">
            <button class="primary-button" id="auth-submit" type="submit">Continue</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/app.js?v=20261119a"></script>
</body>
</html>
