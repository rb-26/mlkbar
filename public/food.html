    <header class="hero hero-compact">
      <div class="brand-lockup">

        <span class="brand-name">mlkbar</span>
      </div>
      <nav class="site-menu" id="site-menu" aria-label="Primary" hidden>

        <div class="menu-grid">
          <a class="menu-link menu-link-wide" href="/customise.html"><svg class="quick-add-icon" viewBox="0 0 32 32" aria-hidden="true" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="16" cy="17.5" r="10"/><path d="M16 7.5Q13.5 4.5 17 3.5"/><path d="M12.5 16.5H12.51M19.5 16.5H19.51"/><path d="M12.5 21Q16 24 19.5 21"/></svg><span>Build Your Profile</span></a>

          <a class="menu-link" href="/allergens.html"><svg class="quick-add-icon" viewBox="0 0 32 32" aria-hidden="true" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M16 4Q22 4 22 10Q22 13 20 16Q22 19 22 22Q22 28 16 28Q10 28 10 22Q10 19 12 16Q10 13 10 10Q10 4 16 4Z"/><path d="M14 9.5H14.01M18 12H18.01M14.5 20.5H14.51M18 23H18.01"/></svg><span>Allergens</span></a>

      </nav>
    </header>

    <main class="page">
      <section class="panel">
        <div class="panel-heading">
          <h2>Add food</h2>
          <p>Tap a dot to add the food to the chosen day.</p>
        </div>
        <div class="food-search-box">
          <input id="food-search" type="search" placeholder="Search foods, e.g. banana" autocomplete="off" enterkeyhint="done" aria-label="Search foods" />
          <input id="food-day" type="date" aria-label="Day eaten" />
        </div>
        <p id="food-results-label" class="food-results-label"></p>
        <div id="food-results" class="food-rows"></div>
        <p id="food-error" class="form-error" hidden></p>
      </section>
      <section class="panel" id="food-suggested">
        <div class="panel-heading">
          <h2>Suggested foods</h2>
        </div>
        <div id="food-groups" class="food-groups"></div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Diary</h2>
        </div>
        <div id="food-diary" class="food-diary empty-state">No foods logged yet.</div>
        <button id="food-more" class="ghost-button food-more" type="button" hidden>Show older days</button>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="Quick">
      <a class="bottom-nav-button" href="/">Add</a>
      <a class="bottom-nav-button" href="/log.html">Log</a>
      <button class="bottom-nav-button bottom-nav-menu active" id="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7H20M4 12H20M4 17H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
