services:
  mlkbar:
    build: .
    container_name: mlkbar
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MLKBAR_SECURE_COOKIE: ${MLKBAR_SECURE_COOKIE:-auto}
      MLKBAR_TRUST_PROXY: ${MLKBAR_TRUST_PROXY:-false}
    ports:
      - "8098:80"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/healthz', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
